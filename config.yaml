# Cau hinh app dich. Sua o day, khong can sua code.
 
hotkeys:
  translate_selection: "ctrl+shift+y"
  translate_ocr: "ctrl+shift+h"   # hotkey cho OCR
  speak_selection: "ctrl+alt+shift+p" # hotkey phat am van ban boi den
 
device: "cpu"          # "cuda" neu may co GPU NVIDIA + CTranslate2 ban GPU
 
engines:
  default: "en-vi"
  en-vi:
    model_dir: "models/en-vi-ct2"
    tokenizer_dir: "models/tokenizer-en-vi"
  # vi-en:                          # bo comment khi co model VI->EN
  #   model_dir: "models/vi-en-ct2"
  #   tokenizer_dir: "models/tokenizer-vi-en"
 
translation:
  max_input_length: 128   # khop voi luc train
  num_beams: 4
  num_hypotheses: 1       # so luong ban dich tra ve
  max_decode_length: 128
 
ui:
  popup_timeout_ms: 15000  # tu dong dong sau bao lau (0 = khong tu dong dong)
  font_size: 13
  max_width: 480

ocr:
  lang: "en"           # paddleocr lang: "en", "vi", "ch", "japan", ...
  use_gpu: false

tts:
  enabled: true
  engine: "piper"          # Local pretrained Piper voices
  auto_speak: false        # Tu dong doc khi co ket qua dich (true/false)
  rate: "+0%"              # Toc do doc: "+0%", "+10%", "-10%"
  volume: "+0%"
  voices:
    en: "models/tts/en_US-lessac-medium.onnx"
    vi: "models/tts/vi_VN-vais1000-medium.onnx"
 